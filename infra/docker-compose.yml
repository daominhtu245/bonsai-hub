# Chạy: docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: bonsai

x-env: &common-env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bonsai}:${POSTGRES_PASSWORD:-bonsai}@postgres:5432/${POSTGRES_DB:-bonsai}
  REDIS_URL: redis://redis:6379/0
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_PUBLIC_ENDPOINT: ${R2_PUBLIC_ENDPOINT:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-bonsai-private}

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_ZALO_APP_ID: ${VITE_ZALO_APP_ID:-}
        VITE_DEV_LOGIN: ${VITE_DEV_LOGIN:-false}  # chỉ bật khi APP_ENV=dev
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *common-env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      TRIAL_CREDITS: ${TRIAL_CREDITS:-1}
    # Không có khóa AI ở đây — chỉ worker giữ.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *common-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-gemini}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-flash-latest}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-gemini}
      IMAGE_MODEL: ${IMAGE_MODEL:-gemini-2.5-flash-image}
      IMAGE_FALLBACK_PROVIDER: ${IMAGE_FALLBACK_PROVIDER:-openai}
      IMAGE_FALLBACK_MODEL: ${IMAGE_FALLBACK_MODEL:-gpt-image-1}
    depends_on:
      api:
        condition: service_healthy  # api chạy migration trước
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bonsai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bonsai}
      POSTGRES_DB: ${POSTGRES_DB:-bonsai}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # S3 local thay R2 khi chưa có key: `--profile local-s3`, đặt R2_ENDPOINT=http://minio:9000,
  # R2_PUBLIC_ENDPOINT=http://localhost:9000, R2_ACCESS_KEY_ID=minio, R2_SECRET_ACCESS_KEY=minio-secret.
  minio:
    profiles: [local-s3]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    profiles: [local-s3]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS} &&
             mc mb -p local/$${BUCKET} &&
             mc ilm rule add --expire-days 1 --prefix uploads/ local/$${BUCKET} || true"
    environment:
      MINIO_USER: ${R2_ACCESS_KEY_ID:-minio}
      MINIO_PASS: ${R2_SECRET_ACCESS_KEY:-minio-secret}
      BUCKET: ${R2_BUCKET:-bonsai-private}

volumes:
  minio-data:
  pg-data:
  redis-data:
