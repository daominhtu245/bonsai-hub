# Chạy: docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: bonsai

x-env: &common-env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bonsai}:${POSTGRES_PASSWORD:-bonsai}@postgres:5432/${POSTGRES_DB:-bonsai}
  REDIS_URL: redis://redis:6379/0
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_PUBLIC_ENDPOINT: ${R2_PUBLIC_ENDPOINT:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-bonsai-private}

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_ZALO_APP_ID: ${VITE_ZALO_APP_ID:-}
        VITE_DEV_LOGIN: ${VITE_DEV_LOGIN:-false}  # chỉ bật khi APP_ENV=dev
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    # Mặc định chỉ nghe 127.0.0.1: Nginx của máy chủ proxy vào, không lộ cổng ra Internet (xem docs/deploy.md).
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *common-env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      TRIAL_CREDITS: ${TRIAL_CREDITS:-1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BANK_BIN: ${BANK_BIN:-}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      BANK_NAME: ${BANK_NAME:-}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      CASSO_SECURE_TOKEN: ${CASSO_SECURE_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    # Không có khóa AI ở đây — chỉ worker giữ.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args:
        WITH_CV: ${WORKER_WITH_CV:-false}  # true khi đã có trọng số YOLO-seg (cài ultralytics + torch CPU)
        WITH_CUTOUT: ${WORKER_WITH_CUTOUT:-true}  # tách nền trên máy trước P1 (ISNet, ~0,8 GB RAM khi chạy)
    volumes:
      - ../models:/models:ro  # trọng số model riêng, vd. models/bonsai-seg.pt
    environment:
      <<: *common-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRUNK_SEG_WEIGHTS: ${TRUNK_SEG_WEIGHTS:-}
      SAM_WEIGHTS: ${SAM_WEIGHTS:-}
      CUTOUT_MODEL: ${CUTOUT_MODEL:-/opt/models/isnet-general-use.onnx}
      CUTOUT_THREADS: ${CUTOUT_THREADS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-gemini}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-flash-latest}
      LLM_ECONOMY_MODEL: ${LLM_ECONOMY_MODEL:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-gemini}
      IMAGE_MODEL: ${IMAGE_MODEL:-gemini-2.5-flash-image}
      IMAGE_FALLBACK_PROVIDER: ${IMAGE_FALLBACK_PROVIDER:-openai}
      IMAGE_FALLBACK_MODEL: ${IMAGE_FALLBACK_MODEL:-gpt-image-1}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DAILY_COST_ALERT_USD: ${DAILY_COST_ALERT_USD:-20}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      ZALO_OA_APP_ID: ${ZALO_OA_APP_ID:-}
      ZALO_OA_SECRET_KEY: ${ZALO_OA_SECRET_KEY:-}
      ZALO_OA_REFRESH_TOKEN: ${ZALO_OA_REFRESH_TOKEN:-}
      ZNS_TEMPLATE_DESIGN_READY: ${ZNS_TEMPLATE_DESIGN_READY:-}
      ZNS_TEMPLATE_RESULT_READY: ${ZNS_TEMPLATE_RESULT_READY:-}
      ZNS_TEMPLATE_RESULT_FAILED: ${ZNS_TEMPLATE_RESULT_FAILED:-}
      ZNS_TEMPLATE_ANALYSIS_FAILED: ${ZNS_TEMPLATE_ANALYSIS_FAILED:-}
    depends_on:
      api:
        condition: service_healthy  # api chạy migration trước
    restart: unless-stopped

  # Lịch định kỳ: kiểm tra lỗi/chi phí/hàng đợi mỗi 10 phút → cảnh báo Telegram. Không cần khóa AI.
  beat:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    command: ["celery", "-A", "bonsai_worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *common-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DAILY_COST_ALERT_USD: ${DAILY_COST_ALERT_USD:-20}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bonsai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bonsai}
      POSTGRES_DB: ${POSTGRES_DB:-bonsai}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # S3 local thay R2 khi chưa có key (SeaweedFS, S3 API): profile `local-s3`, đặt R2_ENDPOINT=http://s3-local:8333,
  # R2_PUBLIC_ENDPOINT=http://localhost:9000 và cặp key bất kỳ (xem .env).
  s3-local:
    profiles: [local-s3]
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["sh", "-c"]
    command:
      - |
        cat > /etc/s3.json <<JSON
        {"identities":[{"name":"bonsai","credentials":[{"accessKey":"$${KEY}","secretKey":"$${SECRET}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json -master.volumeSizeLimitMB=256 -volume.max=0
    environment:
      KEY: ${R2_ACCESS_KEY_ID:-local}
      SECRET: ${R2_SECRET_ACCESS_KEY:-local-secret}
    ports: ["${S3_BIND:-127.0.0.1}:${S3_PORT:-9000}:8333"]
    volumes: [s3-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3-init:
    profiles: [local-s3]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *common-env
    depends_on:
      s3-local:
        condition: service_healthy
    restart: "no"
    command: ["python", "-m", "bonsai_api.scripts.ensure_bucket"]

  # Giám sát uptime (https://github.com/louislam/uptime-kuma): `--profile monitoring`, mở cổng 3001,
  # thêm monitor HTTP cho https://<domain>/healthz và trang chủ, gửi thông báo qua Telegram.
  uptime-kuma:
    profiles: [monitoring]
    image: louislam/uptime-kuma:1.23.15
    ports: ["127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"]
    volumes: [uptime-kuma-data:/app/data]
    restart: unless-stopped

volumes:
  uptime-kuma-data:
  s3-data:
  pg-data:
  redis-data:
