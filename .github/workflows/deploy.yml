name: Deploy

# Chạy tay (chọn môi trường) hoặc khi đẩy tag v*. Cần secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
# Trên VPS: repo clone ở /srv/bonsai (staging: /srv/bonsai-staging), có sẵn file .env.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
  push:
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          REF: ${{ github.ref_name }}
          TARGET: ${{ github.event.inputs.environment || 'production' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REF,TARGET
          script: |
            set -e
            DIR=/srv/bonsai; [ "$TARGET" = "staging" ] && DIR=/srv/bonsai-staging
            cd "$DIR"
            git fetch --tags origin
            git checkout --force "$REF"
            git pull --ff-only origin "$REF" || true
            docker compose -f infra/docker-compose.yml --env-file .env up -d --build --remove-orphans
            docker image prune -f --filter label=bonsai.project=bonsai  # máy chủ dùng chung: chỉ dọn image của bonsai
            WEB_PORT=$(grep -E '^WEB_PORT=' .env | tail -1 | cut -d= -f2); WEB_PORT=${WEB_PORT:-8080}
            for i in $(seq 1 30); do
              curl -fsS "http://localhost:${WEB_PORT:-8080}/healthz" && exit 0
              sleep 5
            done
            echo "healthcheck failed" && exit 1
