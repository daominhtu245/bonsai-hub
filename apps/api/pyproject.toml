[project]
name = "bonsai-api"
version = "0.1.0"
description = "Bonsai AI API: auth, trees, jobs, payments, admin"
requires-python = ">=3.12"
dependencies = [
  "bonsai-pipeline",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "google-auth>=2.34",
  "requests>=2.32",
  "httpx>=0.27",
  "boto3>=1.35",
  "pyyaml>=6.0",
  "celery[redis]>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bonsai_api*"]
